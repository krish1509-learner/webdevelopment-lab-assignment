<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="scipt.js" defer></script>
</head>
<body>
  <main>
    <h1>Student Expense Tracker</h1>

    <div class="container">
      <section class="inputbox">
        <h2>Add an Expense</h2>
        <form id="expense-form">
          <label for="expense-name">Expense Name</label>
          <input type="text" id="expense-name" placeholder="Enter expense name" required>

          <label for="expense-amount">Expense Amount</label>
          <input type="number" id="expense-amount" placeholder="Enter amount" min="0.01" step="0.01" required>

          <label for="expense-category">Category</label>
          <select id="expense-category">
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Shopping">Shopping</option>
            <option value="Education">Education</option>
            <option value="Other">Other</option>
          </select>

          <p id="form-message"></p>
          <button type="submit">Add Expense</button>
        </form>
      </section>

      <section class="tracker">
        <h2>Expense Record</h2>
        <p>Total Expenses: ₹<span id="total-amount">0.00</span></p>

        <label for="category-filter">Filter by Category:</label>
        <select id="category-filter">
          <option value="All">All Categories</option>
          <option value="Food">Food</option>
          <option value="Travel">Travel</option>
          <option value="Shopping">Shopping</option>
          <option value="Education">Education</option>
          <option value="Other">Other</option>
        </select>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>S.No.</th>
                <th>Expense Name</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="expense-record"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
